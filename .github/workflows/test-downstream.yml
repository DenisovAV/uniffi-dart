on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:

name: Test Downstream

jobs:
  test-payjoin:
    name: Test rust-payjoin Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout rust-payjoin
        uses: actions/checkout@v4
        with:
          repository: payjoin/rust-payjoin
          path: rust-payjoin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Patch uniffi-dart dependency
        run: |
          cat >> rust-payjoin/Cargo.toml << 'EOF'

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart.git']
          uniffi-dart = { path = "../main" }
          EOF

      - name: Bump payjoin-ffi to uniffi 0.32
        # rust-payjoin still pins uniffi 0.31.2; its 0.31 metadata cannot be read by
        # this PR's 0.32 bindgen. Bump its own uniffi to 0.32 (it compiles and its
        # Dart suite passes unchanged on 0.32). Removed once rust-payjoin ships 0.32
        # upstream. Every mutation is asserted so a silent no-op (upstream reformats
        # the line) fails loudly instead of testing the wrong version.
        run: |
          set -euo pipefail
          sed -i 's/uniffi = { version = "0.31.2"/uniffi = { version = "0.32"/g' rust-payjoin/payjoin-ffi/Cargo.toml
          grep -q 'uniffi = { version = "0.32"' rust-payjoin/payjoin-ffi/Cargo.toml \
            || { echo "::error::payjoin-ffi uniffi 0.32 bump was a no-op (Cargo.toml format drifted)"; exit 1; }
          # The native-assets build pins rustc 1.85.1 (< uniffi 0.32's effective
          # 1.91 toolchain floor); native_toolchain_rust requires an *exact* channel
          # and a `targets` list, so pin 1.91.0 with just the Linux host target.
          mapfile -t _tc < <(find rust-payjoin -name rust-toolchain.toml)
          [ "${#_tc[@]}" -ge 1 ] || { echo "::error::no rust-toolchain.toml found to pin in rust-payjoin"; exit 1; }
          for f in "${_tc[@]}"; do
            printf '[toolchain]\nchannel = "1.91.0"\ntargets = ["x86_64-unknown-linux-gnu"]\n' > "$f"
          done

      - name: Verify forced 0.32 resolved
        # Positive check that the crate graph actually resolved uniffi 0.32. If the
        # bump or the uniffi-dart [patch] silently didn't apply (cargo treats an
        # unused [patch] as a warning, not an error), uniffi stays 0.31 and this
        # fails loudly — instead of a confusing downstream metadata error, or (once
        # uniffi-dart 0.32 is published) passing against the wrong crate.
        run: |
          set -euo pipefail
          cargo tree --manifest-path rust-payjoin/payjoin-ffi/Cargo.toml 2>/dev/null | grep -qE 'uniffi v0\.32' \
            || { echo "::error::payjoin did not resolve uniffi 0.32 (bump/patch no-op)"; exit 1; }

      - name: Generate dart bindings and run tests
        # Guard against a vacuous green: bare `dart test` exits 0 on "No tests ran"
        # and "All tests skipped", so fail if the suite ran nothing real.
        run: |
          set -euo pipefail
          cd rust-payjoin/payjoin-ffi/dart
          bash scripts/generate_bindings.sh
          dart test 2>&1 | tee test-output.log
          if grep -qE 'No tests ran|All tests skipped' test-output.log; then
            echo "::error::payjoin downstream ran zero tests (vacuous green)"; exit 1
          fi

  test-bdk:
    name: Test bdk-dart Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout bdk-dart
        uses: actions/checkout@v4
        with:
          repository: bitcoindevkit/bdk-dart
          path: bdk-dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch and bump bdk-ffi to uniffi 0.32
        # bdk-dart re-exports bdk-ffi (pinned git rev, uniffi 0.31.2), so the
        # metadata bdk_dart_ffi embeds is 0.31 and unreadable by the 0.32 bindgen.
        # Clone that exact rev, bump its uniffi to 0.32, and [patch] bdk-dart onto
        # it. Removed once bdk-ffi ships 0.32 upstream.
        run: |
          set -euo pipefail
          BDK_FFI_REV=17c48b8b52ba81cdc58531e75ad1165be0cc25d9
          # Assert bdk-dart still pins exactly this rev — a drift would mean we
          # clone/patch a different bdk-ffi than bdk-dart actually depends on.
          grep -q "$BDK_FFI_REV" bdk-dart/native/Cargo.toml \
            || { echo "::error::bdk-dart's bdk-ffi rev drifted from BDK_FFI_REV; update the workflow"; exit 1; }
          git init -q bdk-ffi
          git -C bdk-ffi remote add origin https://github.com/bitcoindevkit/bdk-ffi.git
          git -C bdk-ffi fetch --depth 1 origin "$BDK_FFI_REV" -q
          git -C bdk-ffi checkout -q FETCH_HEAD
          sed -i 's/uniffi = { version = "=0.31.2"/uniffi = { version = "0.32"/g' bdk-ffi/bdk-ffi/Cargo.toml
          grep -q 'uniffi = { version = "0.32"' bdk-ffi/bdk-ffi/Cargo.toml \
            || { echo "::error::bdk-ffi uniffi 0.32 bump was a no-op"; exit 1; }

      - name: Patch bdk-dart onto uniffi 0.32 (uniffi, uniffi-dart, bdk-ffi)
        run: |
          set -euo pipefail
          sed -i 's/uniffi = { version = "=0.31.2"/uniffi = { version = "0.32"/g' bdk-dart/native/Cargo.toml
          grep -q 'uniffi = { version = "0.32"' bdk-dart/native/Cargo.toml \
            || { echo "::error::bdk-dart uniffi 0.32 bump was a no-op"; exit 1; }
          cat >> bdk-dart/native/Cargo.toml << 'EOF'

          [patch.'https://github.com/Uniffi-Dart/uniffi-dart']
          uniffi-dart = { path = "../../main" }

          [patch.'https://github.com/bitcoindevkit/bdk-ffi.git']
          bdk-ffi = { path = "../../bdk-ffi/bdk-ffi" }
          EOF
          # Lockfile pins uniffi 0.31.2 / the old bdk-ffi rev; drop it so the bump
          # and patches re-resolve cleanly.
          rm -f bdk-dart/native/Cargo.lock
          # native builds pin rustc 1.85.1 (< uniffi 0.32's effective 1.91 floor);
          # pin an exact 1.91.0 + host target (native_toolchain_rust rejects `stable`).
          mapfile -t _tc < <(find bdk-dart bdk-ffi -name rust-toolchain.toml)
          [ "${#_tc[@]}" -ge 1 ] || { echo "::error::no rust-toolchain.toml found to pin"; exit 1; }
          for f in "${_tc[@]}"; do
            printf '[toolchain]\nchannel = "1.91.0"\ntargets = ["x86_64-unknown-linux-gnu"]\n' > "$f"
          done

      - name: Verify forced 0.32 + local patches resolved
        # Positive checks: uniffi actually resolved to 0.32, and the bdk-ffi [patch]
        # actually took (bdk-ffi resolved to a local path, not the upstream git rev).
        # An unused [patch] is only a cargo warning, so without this a silent no-op
        # could test the wrong graph and still go green.
        run: |
          set -euo pipefail
          meta=$(cargo tree --manifest-path bdk-dart/native/Cargo.toml 2>/dev/null)
          echo "$meta" | grep -qE 'uniffi v0\.32' \
            || { echo "::error::bdk did not resolve uniffi 0.32 (bump/patch no-op)"; exit 1; }
          echo "$meta" | grep 'bdk-ffi ' | grep -q '(/' \
            || { echo "::error::bdk-ffi [patch] not applied (not resolved to a local path)"; exit 1; }

      - name: Generate dart bindings and run tests
        run: |
          set -euo pipefail
          cd bdk-dart
          bash scripts/generate_bindings.sh
          dart test 2>&1 | tee test-output.log
          if grep -qE 'No tests ran|All tests skipped' test-output.log; then
            echo "::error::bdk downstream ran zero tests (vacuous green)"; exit 1
          fi
